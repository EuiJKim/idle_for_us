<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>우리끼리 회귀무림</title>
  <meta name="description" content="친구끼리 하는 무협 회귀 방치형 RPG">
  <meta name="theme-color" content="#14110e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="회귀무림">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Nanum+Brush+Script&family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="stage-box">
        <div id="stage-label">STAGE 1</div>
        <div id="zone-label">고요한 들판</div>
      </div>
      <div class="res"><span class="cur silver">銀</span><b id="gold">0</b></div>
      <div class="res"><span class="cur gem">寶</span><b id="gems">0</b></div>
      <button id="btn-missions" class="icon-btn hz" aria-label="일일 의뢰">令</button>
      <button id="btn-settings" class="icon-btn hz" aria-label="설정">設</button>
    </header>

    <section id="battle">
      <canvas id="cv"></canvas>
      <div id="hud">
        <div id="power-label">전투력 0</div>
        <div id="net-badge" class="net connecting">연결 중</div>
      </div>
      <div id="progress">
        <div id="progress-fill"></div>
        <span id="progress-text">0 / 10</span>
      </div>
      <button id="btn-boss" class="hidden">두목 도전</button>
      <div id="exp-bar"><div></div></div>
      <div id="contest-hud" class="hidden">
        <div id="contest-title"></div>
        <div id="contest-sub"></div>
      </div>

      <!-- 창 버튼은 들판 위에 떠 있다. 누르면 아래에서 창이 올라온다. -->
      <nav id="tabs">
        <div class="tabcol left">
          <button data-tab="companion"><span>靈</span>영수</button>
          <button data-tab="dungeon"><span>洞</span>비경</button>
          <button data-tab="social"><span>盟</span>무림</button>
        </div>
        <div class="tabcol right">
          <button data-tab="growth"><span>修</span>수련</button>
          <button data-tab="equip"><span>兵</span>병기</button>
          <button data-tab="skill"><span>武</span>무공</button>
        </div>
      </nav>

      <div id="skillbar"></div>
    </section>

    <div id="panel-dim"></div>
    <main id="panel"></main>
  </div>

  <div id="modal" class="hidden"><div class="sheet"></div></div>
  <div id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
