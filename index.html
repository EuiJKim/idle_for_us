<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>우리끼리 무림</title>
  <meta name="description" content="친구끼리 하는 무협 회귀 방치형 RPG">
  <meta name="theme-color" content="#14110e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="회귀무림">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Nanum+Brush+Script&family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 상단: 내 정보 한 덩어리.
         근거: Blade Idle의 Status(720x136)가 초상화·이름·경지·경험치를 한 블록으로 묶는다.
         (docs/BladeIdle_화면구조.md 4절) -->
    <header id="topbar">
      <div class="hero-box">
        <canvas id="portrait" width="104" height="104" aria-hidden="true"></canvas>
        <div class="hero-txt">
          <div class="hero-line"><b id="hero-name">무명</b></div>
          <div class="hero-sub"><span id="hero-rank">-</span><span id="hero-lv">Lv.1</span></div>
          <div id="exp-bar"><div></div></div>
        </div>
      </div>
      <div class="res-col">
        <div class="res"><span class="cur silver">은</span><b id="gold">0</b></div>
        <div class="res"><span class="cur potion">약</span><b id="potions">0</b></div>
      </div>
      <button id="btn-settings" class="icon-btn" aria-label="설정">⚙</button>
    </header>

    <!-- 사냥터 줄: 이름(누르면 지도) · 레벨대 · 두목까지 · 체력 -->
    <div id="stagebar">
      <div class="stage-box">
        <div id="stage-label">객잔 마을</div>
        <div id="zone-label">쉬는 중</div>
      </div>
      <div id="progress" class="hp">
        <div id="progress-fill"></div>
        <span id="progress-text">0 / 0</span>
      </div>
    </div>

    <section id="battle">
      <canvas id="cv"></canvas>
      <div id="hud">
        <div id="power-label">전투력 0</div>
        <div id="net-badge" class="net connecting">연결 중</div>
      </div>
      <div id="gate-hint" class="hidden"></div>
      <button id="advice" class="hidden"></button>
      <button id="btn-boss" class="hidden">두목 도전</button>
      <div id="contest-hud" class="hidden">
        <div id="contest-title"></div>
        <div id="contest-sub"></div>
      </div>

      <!-- 창 버튼은 들판 위에 떠 있다. 누르면 아래에서 창이 올라온다. -->
      <nav id="tabs">
        <div class="tabcol left">
          <button data-tab="map"><i>지</i><span>지도</span></button>
          <button data-tab="town"><i>촌</i><span>마을</span></button>
          <button data-tab="social"><i>무</i><span>무림</span></button>
        </div>
        <div class="tabcol right">
          <button data-tab="char"><i>인</i><span>캐릭터</span></button>
          <button data-tab="bag"><i>낭</i><span>가방</span></button>
        </div>
      </nav>

      <div id="skillbar"></div>
    </section>

    <div id="panel-dim"></div>
    <main id="panel">
      <div id="panel-head">
        <button id="panel-grip" aria-label="창 펼치기"></button>
        <b id="panel-title"></b>
        <!-- 자원칸은 비워 둔다. 지금 보는 화면이 쓰는 자원을 main.js panelRes()가 채운다 -->
        <div class="res-row"></div>
        <button id="panel-close" aria-label="닫기">✕</button>
      </div>
      <div id="panel-body"></div>
    </main>
  </div>

  <div id="modal" class="hidden"><div class="sheet"></div></div>
  <div id="toast"></div>

  <script type="module" src="js/wmain.js"></script>
</body>
</html>
