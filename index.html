  <script>
    // v629 컴퓨터는 가로 화면 고정 — pc.html이 이 게임을 가로 틀(높이 720)에 넣어 창 크기에 맞춰 키운다. 손전화 · 태블릿(손가락) · 이미 틀 안 · 끈 사람은 그대로.
    //   자동 시험(webdriver)은 ?pcfix=1 일 때만 틀로 간다(다른 시험은 이 화면을 바로 본다)
    (function () {
      try {
        if (window.top !== window) return;
        var q = location.search, ls = localStorage.getItem('ifu-s2-pcfix');
        var pc = matchMedia('(pointer: fine)').matches && matchMedia('(hover: hover)').matches && !matchMedia('(pointer: coarse)').matches;
        if (!pc || ls === '0' || (navigator.webdriver && !/[?&]pcfix=1(&|$)/.test(q))) return;
        window.stop();
        location.replace('pc.html' + q + location.hash);
      } catch (e) { /* 틀 없이 그대로 */ }
    })();
  </script>

    /* v624 다 뒤집은 뒤 — 등급별 칩 · 새로 n · 진↑ 가장 좋은 것에 「최고」 띠와 도는 빛살 */

       · 알림 줄(길잡이 완료 · 업적 달성 …)은 Lv · HP 상자 위로 — 둘째 줄이 상자 뒤로 숨던 것
       · 업적 알림은 오른쪽 위 메뉴 아래(알림 자리 — 그 아래 좋은 장비 카드) — 가운데 사냥터 이름 · Stage 줄을 가리던 것. 두목전 · 던전 중에는 끝난 뒤에(화면.js)
       · 좁은 화면(폭 800 이하): 두목 도전 단추는 기연 · 받을 보상 칸 아래 줄로 — 기연 칸과 겹치던 것 · 전투력 오름 알림은 작게 — 사냥터 이름을 가리던 것 */
    #loglines { bottom: calc(var(--sb) + 78px); }
    html.w720 #loglines { bottom: calc(var(--sb) + 130px); }
    .achpop, body:has(.pwpop) .achpop { left: auto; right: var(--sr, 10px); top: calc(var(--st, 0px) + 58px); max-width: min(48%, 330px); transform: none; animation-name: achpop2; }
    html.w720 .achpop { max-width: min(44%, 300px); }
    html.rot .achpop { right: 10px; }
    @keyframes achpop2 { 0% { opacity: 0; transform: translateX(18px) scale(.94); } 10% { opacity: 1; transform: translateX(0) scale(1.03); } 18% { transform: none; } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
    .achpop b { max-width: min(34vw, 240px); }
    html.w800 #btn-boss { left: calc(var(--sl) + 204px); transform: none; top: calc(var(--st) + 146px); }
    .pwpop { left: calc(var(--sl, 0px) + 62px); top: calc(var(--st, 0px) + 2px); }
    html.w800 .pwpop { padding: 2px 8px; gap: 4px; } html.w800 .pwpop small { display: none; } html.w800 .pwpop b { font-size: 14px; } html.w800 .pwpop em { font-size: 11px; } html.w720 .pwpop em { display: none; }
    /* 결과 창(STAGE CLEAR …)이 떠 있는 동안 알림은 맨 위로 — 「다음 스테이지」 단추를 가리던 것(결과 창 뒤는 어둡게 덮여 있다) */
    body:has(#res.open) #toast, html.w720 body:has(#res.open) #toast, html.h340 body:has(#res.open) #toast { top: calc(var(--st, 0px) + 4px); bottom: auto; left: 50%; }
    /* v634 뜻대로 굴리기(rl2) · 전투력 미리보기 — 창은 .rl2를 담은 알림 창만 넓게 */
    body.land #modal .sheet:has(> div > .rl2) { max-width: min(640px, 94vw); }
    .rl2 { display: flex; flex-direction: column; gap: 8px; font-size: 12.5px; }
    .rl2-lines { display: flex; flex-direction: column; gap: 4px; }
    .rl2-card { margin: 2px 0 6px; }
    .rl2-ln { display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 6px; background: #0006; border-left: 3px solid var(--gc, #777); line-height: 18px; min-width: 0; }
    .rl2-ln em { font-style: normal; font-size: 10.5px; font-weight: 800; color: var(--gc); min-width: 26px; }
    .rl2-ln b { font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rl2-ln i { font-style: normal; margin-left: auto; color: var(--gc); font-weight: 800; font-variant-numeric: tabular-nums; }
    .rl2-ln.none { --gc: #555; opacity: .7; } .rl2-ln.none b { color: var(--mute); font-weight: 400; }
    .rl2-lb { display: flex; align-items: center; gap: 6px; width: 100%; min-height: 40px; padding: 2px 4px; background: none; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; color: inherit; font: inherit; cursor: pointer; text-align: left; }
    .rl2-pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 4px; } .rl2-pick .rl2-lb { flex-direction: column; align-items: stretch; gap: 1px; padding: 3px; }
    .rl2-pick .rl2-ln { padding: 2px 6px; } .rl2-nt { margin: 0; font-size: 11px; }
    .rl2-lb .rl2-ln { flex: 1; } .rl2-lb u { text-decoration: none; font-size: 10.5px; color: var(--mute); min-width: 38px; text-align: center; }
    .rl2-lb.on { border-color: var(--gold); background: #e8c26a14; } .rl2-lb.on u { color: var(--gold); font-weight: 800; }
    .rl2-f small { display: block; color: var(--mute); font-size: 11px; margin-bottom: 3px; } .rl2-f small i { font-style: normal; opacity: .75; }
    .rl2-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .rl2-chs, .rl2-seg { display: flex; flex-wrap: wrap; gap: 4px; }
    .rl2-ch, .rl2-seg button { min-height: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: #0005; color: #ddd; font: inherit; font-size: 12px; cursor: pointer; }
    .rl2-ch.on, .rl2-seg button.on { border-color: var(--gold); background: rgba(212,166,74,.25); color: #fff; font-weight: 800; }
    .rl2-res .rl2-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; } .rl2-res .rl2-hd b { font-size: 15px; } .rl2-res .rl2-hd span { color: var(--mute); font-size: 11.5px; }
    .rl2-res.hit .rl2-hd b { color: var(--gold); text-shadow: 0 0 10px #e8c26a88; }
    .rl2-cmp { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; }
    .rl2-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; } .rl2-col small { color: var(--mute); font-size: 11px; } .rl2-ar { color: var(--gold); font-weight: 900; }
    .rl2-pw { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px; border-radius: 8px; background: #0005; } .rl2-pw small { color: var(--mute); }
    .rl2-pv { font-style: normal; font-weight: 800; white-space: nowrap; } .rl2-pv.up { color: var(--green); } .rl2-pv.dn { color: var(--red); } .rl2-pv.eq { color: var(--mute); }
    .rl2-pvt { display: inline-block; margin-left: 6px; font-size: 10.5px; color: var(--mute); white-space: nowrap; } p > .rl2-pvt { display: block; margin: 2px 0 0; }
    .rl2-cl { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 11px; color: #ddd; background: #000b; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
    .rl2-jg { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; max-height: 240px; overflow: auto; }
    .rl2-jb { display: flex; flex-direction: column; gap: 3px; padding: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); background: #0004; color: inherit; font: inherit; text-align: left; cursor: pointer; min-height: 44px; }
    .rl2-jb > small { color: var(--mute); font-size: 10.5px; } .rl2-jb:focus-visible, .rl2-lb:focus-visible, .rl2-ch:focus-visible, .rl2-seg button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    html.h420 .rl2-pick .rl2-lb { flex-direction: row; align-items: center; } html.h420 .rl2-pick .rl2-lb u { min-width: 28px; } html.h420 .rl2-nt { display: none; } html.h420 .rl2-chs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; } html.h420 .rl2-ch { flex: none; } html.h420 .rl2-f small { margin-bottom: 2px; }
    html.h500 .rl2 { gap: 5px; } html.h500 .rl2-lb { min-height: 34px; } html.h500 .rl2-ch, html.h500 .rl2-seg button { min-height: 28px; }
  </style>
</head>
<body>
  <div id="app">
    <section id="battle">
      <canvas id="cv"></canvas>
      <!-- v510 들판 위 HUD — 모서리마다 한 덩어리, 아이콘 + 짧은 글 -->
      <header id="tl">
        <canvas id="face" width="104" height="104" aria-hidden="true"></canvas>
        <div class="tl-txt">
          <div id="pw">0</div>
          <div id="nm"><b id="me-job">무명</b><span id="me-rank">입문</span></div>
          <div class="cur-row"><span class="cur-pill"><i class="coin s"></i><b id="g-gold">0</b></span><span class="cur-pill"><i class="coin t"></i><b id="g-tix">0</b></span></div>
        </div>
      </header>
      <div id="tc">
        <div id="chap-row"><svg class="ic" viewBox="0 0 24 24"><path d="M12 21s-6-6-6-11a6 6 0 0 1 12 0c0 5-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg><span id="chap">1. 죽림</span></div>
        <div id="sp"><div id="sp-fill"></div><span id="sp-txt">Stage 1/10</span></div>
      </div>
      <div id="tr">
        <button class="ib nb" data-tab="map"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg><span>지도</span></button>
        <button class="ib nb" data-tab="town"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg><span>임무</span></button>
        <button class="ib nb" data-tab="social"><svg class="ic" viewBox="0 0 24 24"><path d="M5 21V3"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg><span>무림</span></button>
        <button class="ib" id="b-saver" aria-label="절전"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>절전</span></button>
        <button class="ib" id="b-opt" aria-label="설정"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>설정</span></button>
      </div>
      <button id="qc" class="hidden"></button>
      <button id="fc" class="fate-chip hidden" aria-label="기연"><i>緣</i><span>기연</span><b id="fc-n"></b><em class="fate-fill" id="fc-fill"></em></button>
      <button id="rc" class="rw-chip hidden" aria-label="받을 보상"><img src="art/s2/ui/chest.webp" alt="" decoding="async"><span>받을 보상</span><b id="rc-n"></b></button>
      <button id="bf" class="bf-chip hidden" aria-label="단약"><span class="bf-r" data-id="exp"><i>清</i><u></u></span><span class="bf-r" data-id="gold"><i>財</i><u></u></span><span class="bf-r" data-id="atk"><i>血</i><u></u></span></button>
      <button id="nx" class="hidden"></button>
      <div class="dpsm" id="dpsm"></div>
      <div id="loglines"></div>
      <button id="btn-boss" class="hidden">두목 도전</button>
      <div id="lootbox"></div>
      <div id="contest-hud" class="hidden"><div class="ch-h"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8l4 3 4-6 4 6 4-3-2 11H6z"/></svg><b id="contest-title"></b><span id="contest-pct"></span><button id="dg-leave" class="hidden">나가기</button></div><div id="contest-bar"><i id="contest-trail"></i><i id="contest-fill"></i><i class="ntk" style="left:25%"></i><i class="ntk" style="left:50%"></i><i class="ntk" style="left:75%"></i><i id="contest-pop"></i></div><div id="cb-row"><span id="cb-ph"></span><div id="cb-ggb"><i id="cb-gg"></i></div></div><div id="contest-sub"></div></div>
      <div id="me">
        <div class="me-h"><b id="me-lv">Lv.1</b><span id="me-nm">무명</span></div>
        <div class="bar hp"><i id="hp-trail"></i><i id="hp-fill"></i><span id="hp-txt">HP 0 / 0</span></div>
        <div class="hb-xp"><div class="hb-xpb"><i id="hb-xp-fill"></i></div><span id="hb-xp-txt">0.00%</span></div>
        <button id="lvb" class="lvb" aria-label="성장 봇짐"><img src="art/s2/ui/chest.webp" alt="" decoding="async"><b id="lvb-n"></b></button>
      </div>
      <nav id="mb">
        <button class="nb" data-tab="char"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>캐릭터</span></button>
        <button class="nb" data-tab="bag"><svg class="ic" viewBox="0 0 24 24"><path d="M8 3L3 6l2 5 3-1v11h8V10l3 1 2-5-5-3c-.6 1.8-2.1 3-4 3S8.6 4.8 8 3z"/></svg><span>장비</span></button>
        <button class="nb" data-key="hero:1"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c.5 3.5 6 5.5 6 10.5a6 6 0 0 1-12 0c0-2.8 1.6-4.3 2.3-6 .9 1.2 1.6 2.5 1.7 4 1.4-2.2 2.2-5.3 2-8.5z"/></svg><span>무공</span></button>
        <button class="nb" data-tab="comp"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.6 14.2c3 .2 5.4 2.3 5.4 5.8"/></svg><span>동료</span></button>
        <button class="nb" data-tab="dgn"><svg class="ic" viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/></svg><span>던전</span></button>
      </nav>
      <div id="pad" class="hidden"><button id="pl" aria-label="왼쪽">◀</button><button id="pd" aria-label="내려가기">▼</button><button id="pr" aria-label="오른쪽">▶</button></div>
      <div id="sk"><button id="au" class="on">자동</button><div id="slots" style="display:contents"></div><div id="pbuf" class="hidden"></div><button id="ds" class="hidden" aria-label="회피"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12h11M11 6l6 6-6 6M19 5v14"/></svg><i></i></button><button id="jp" aria-label="점프"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
      <div id="xpl"><span id="xp-txt">EXP 0.00%</span><div id="xp-bar"><i id="xp-fill"></i></div></div>
      <div id="combo"></div><div id="res"></div>
    </section>

    <div id="panel-dim"></div>
    <main id="panel">
      <div id="panel-head">
        <button id="panel-grip" aria-label="창 펼치기"></button>
        <b id="panel-title"></b>
        <div class="res-row"></div>
        <button id="panel-close" aria-label="닫기">✕</button>
      </div>
      <nav id="ptabs"></nav>
      <div id="panel-body"></div>
    </main>
  </div>

  <div id="modal" class="hidden"><div class="sheet"></div></div>
  <div id="toast"></div>
  <script type="module" src="js/s2/ui/app.js"></script>
</body>
</html>
