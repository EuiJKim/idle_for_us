<!doctype html>
<html lang="ko">
<head>

  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#120f0b">

  <!-- v505 지금 게임(무림방치)과 같은 화면 틀 · 같은 CSS — 위 상태 줄 · 사냥터 줄 · 들판(양옆 창 단추 · 무공 줄) · 아래에서 올라오는 창 -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --mute: var(--muted); --ink: var(--text); --red: #e06a5a; --blue: #6aa8e0; --green: #7cc47a; }
    /* 새 시즌만의 것 — 옆보기 조작(◀▼▶ · 점프) · 두목 도전 · 길잡이 자리 · 피해 측정기 · 결과 · 장비 창 · 뽑기 연출 */
    #panel-body .card .row:last-child { margin-bottom: 0; }
    #panel-body .row .btn { flex: none; padding: 8px 12px; min-width: 56px; }
    #panel-body .row .btn + .btn { margin-left: -4px; }
    #panel-body .row.wide { flex-wrap: wrap; } #panel-body .row.wide .info { flex: 1 1 calc(100% - 50px); } #panel-body .row.wide .btn:first-of-type { margin-left: auto; }
    #panel-body .chip-row .chip.on { border-color: var(--accent-2); background: rgba(212,166,74,.15); }
    .note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 4px 2px 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-bottom: 10px; }
    .cell { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; text-align: center; font-size: 11px; min-height: 58px; }
    .cell b { display: block; font-size: 15px; font-family: var(--serif); }
    .g0 { border-color: #777 } .g1 { border-color: #7cc47a } .g2 { border-color: #6aa8e0 } .g3 { border-color: #b27ae0 } .g4 { border-color: #e8c26a } .g5 { border-color: #e06a5a } .g6 { border-color: #fff }
    .g0t { color: #ccc } .g1t { color: #7cc47a } .g2t { color: #6aa8e0 } .g3t { color: #b27ae0 } .g4t { color: #e8c26a } .g5t { color: #e06a5a } .g6t { color: #fff }
    /* v513 두목전 결과 — 가운데 판 · 빛살 · 보상 칸이 차례로 튀어나옴 · 3초 막대 */
    #res { position: absolute; inset: 0; z-index: 55; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
    #res.open { display: flex; animation: rfade .2s ease-out; }
    @keyframes rfade { from { opacity: 0 } to { opacity: 1 } }
    #res .rp { position: relative; width: min(420px, 86vw); padding: 20px 18px 14px; border-radius: 18px; text-align: center; color: #fff; background: rgba(18,15,12,.94); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 16px 50px rgba(0,0,0,.6); animation: rpop .38s cubic-bezier(.2,1.4,.4,1); overflow: hidden; }
    #res.win .rp { border-color: rgba(232,200,122,.55); }
    @keyframes rpop { from { transform: scale(.82); opacity: 0 } to { transform: none; opacity: 1 } }
    #res .rays { position: absolute; left: 50%; top: 46px; width: 520px; height: 520px; margin: -260px 0 0 -260px; pointer-events: none; opacity: .22; background: repeating-conic-gradient(from 0deg, rgba(255,213,106,.9) 0deg 7deg, transparent 7deg 22deg); -webkit-mask: radial-gradient(circle, #000 15%, transparent 62%); mask: radial-gradient(circle, #000 15%, transparent 62%); animation: rspin 14s linear infinite; }
    @keyframes rspin { to { transform: rotate(360deg) } }
    #res .rsub { position: relative; font-size: 12.5px; color: rgba(255,255,255,.65); font-weight: 700; }
    #res .rtitle { position: relative; margin: 2px 0 6px; font-size: 34px; font-weight: 900; letter-spacing: 1px; line-height: 1.1; }
    #res.win .rtitle { background: linear-gradient(180deg, #fff7d6, #f2c14e 55%, #c9821f); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 6px rgba(232,180,60,.45)); }
    #res.lose .rtitle { color: #e9a99f; }
    #res .rmeta { position: relative; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: rgba(255,255,255,.6); }
    #res .rmeta b { color: #fff; font-variant-numeric: tabular-nums; }
    #res .rtiles { position: relative; display: flex; justify-content: center; gap: 10px; margin: 14px 0 10px; }
    #res .rt { width: 92px; padding: 9px 4px 7px; border-radius: 12px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: center; gap: 3px; opacity: 0; animation: rtile .34s cubic-bezier(.2,1.5,.4,1) var(--d) forwards; }
    #res .rt .coin { width: 26px; height: 26px; }
    #res .rt b { font-size: 16px; font-weight: 900; font-variant-numeric: tabular-nums; }
    #res .rt small { font-size: 10.5px; color: rgba(255,255,255,.55); }
    @keyframes rtile { from { opacity: 0; transform: translateY(10px) scale(.7) } to { opacity: 1; transform: none } }
    #res .rnext { position: relative; font-size: 12.5px; color: rgba(255,255,255,.75); margin-bottom: 12px; } #res .rnext em { font-style: normal; font-weight: 800; color: #2a1a05; background: var(--gold); border-radius: 4px; padding: 0 5px; margin-right: 4px; }
    #res .rtip { position: relative; margin: 12px 0; font-size: 12px; color: rgba(255,255,255,.6); }
    #res .racts { position: relative; display: flex; gap: 8px; justify-content: center; }
    #res .racts .btn { min-height: 42px; padding: 0 14px; border-radius: 10px; border: 0; font-weight: 800; color: #fff; background: rgba(255,255,255,.1); }
    #res .racts .btn.primary { position: relative; overflow: hidden; min-width: 170px; color: #2a1a05; background: linear-gradient(180deg, #f6cf62, #e0a53a); box-shadow: 0 2px 0 #9a6a16; }
    #res .rgo span { position: relative; z-index: 1; }
    #res .rbar { position: absolute; left: 0; bottom: 0; height: 100%; width: 0; background: rgba(255,255,255,.35); }
    #res.timed .rbar { animation: rbar 3s linear forwards; }
    @keyframes rbar { to { width: 100% } }
    #res .rauto { position: relative; display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 11.5px; color: rgba(255,255,255,.55); cursor: pointer; }
    #res .rauto input { accent-color: #e0a53a; width: 15px; height: 15px; }
    @media (prefers-reduced-motion: reduce) { #res .rays, #res .rp, #res .rt { animation: none; opacity: 1; } #res.timed .rbar { animation-duration: 3s; } }
    /* (h420: JS가 돌린 뒤의 실제 가로 · 세로로 붙인다) */ html.h420 #res .rp { padding: 10px 16px 8px; }
    html.h420 #res .rtitle { font-size: 26px; margin: 0 0 4px; }
    html.h420 #res .rtiles { margin: 8px 0 6px; }
    html.h420 #res .rt { width: auto; min-width: 104px; flex-direction: row; gap: 6px; padding: 6px 10px; }
    html.h420 #res .rt .coin { width: 20px; height: 20px; }
    html.h420 #res .rt small { order: 3; }
    html.h420 #res .rnext { margin-bottom: 8px; }
    html.h420 #res .rtip { margin: 8px 0; }
    html.h420 #res .racts .btn { min-height: 38px; }
    html.h420 #res .rauto { margin-top: 6px; }
    /* 장비 뽑기 연출(v497) */
    .gx { position: fixed; inset: 0; z-index: 60; background: radial-gradient(#1a1410ee, #050302f5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    .gx.flash::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, var(--gc, #fff) 0%, transparent 70%); animation: gxf .7s ease-out forwards; }
    @keyframes gxf { from { opacity: .85 } to { opacity: 0 } }
    .gxt { font-weight: 800; color: var(--gold); font-size: 16px; text-align: center; }
    .gxg { display: grid; grid-template-columns: repeat(5, 64px); gap: 8px; max-height: 70vh; overflow: auto; }
    .gxg.many { grid-template-columns: repeat(10, 52px); gap: 5px; }
    .gc { position: relative; width: 64px; height: 84px; perspective: 400px; }
    .gxg.many .gc { width: 52px; height: 70px; }
    .gc > div { position: absolute; inset: 0; border-radius: 9px; backface-visibility: hidden; transition: transform .32s ease; }
    .gc .back { background: repeating-linear-gradient(45deg, #3a2a18, #3a2a18 6px, #2a1e10 6px, #2a1e10 12px); border: 2px solid #6b5230; }
    .gc .face { transform: rotateY(180deg); background: radial-gradient(#3a2e22, #17120d); border: 2px solid var(--gc); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; }
    .gc .face img { width: 78%; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); } .gc .face small { color: var(--mute); font-size: 10px; }
    .gc .face i { position: absolute; top: 2px; right: 3px; font-style: normal; font-size: 9px; background: var(--gold); color: #000; border-radius: 4px; padding: 0 3px; }
    .gc.open .back { transform: rotateY(180deg); } .gc.open .face { transform: rotateY(360deg); }
    .gc.open.g4 .face, .gc.open.g5 .face, .gc.open.g6 .face { animation: gcp 1.2s ease-in-out infinite alternate; }
    @keyframes gcp { from { box-shadow: 0 0 8px 1px var(--gc) } to { box-shadow: 0 0 20px 6px var(--gc) } }
    .gc.tense .back { animation: gct .12s linear infinite; box-shadow: 0 0 18px 6px var(--gc); border-color: var(--gc); }
    @keyframes gct { 0% { transform: translate(0, 0) } 25% { transform: translate(-2px, 1px) } 50% { transform: translate(2px, -1px) } 75% { transform: translate(-1px, -1px) } 100% { transform: translate(1px, 1px) } }
    .gxb .btn { min-width: 120px; min-height: 44px; }
    .eqpage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    /* (w640up: JS가 돌린 뒤의 실제 가로 · 세로로 붙인다) */ html.w640up .eqpage { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
    .eqwrap { display: grid; grid-template-columns: 66px 1fr 66px; gap: 6px; align-items: center; max-width: 460px; margin: 0 auto; }
    .eqcol { display: flex; flex-direction: column; gap: 6px; }
    .eqcell { position: relative; width: 66px; height: 66px; border-radius: 12px; border: 2px solid var(--line); background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--gc, #3a2e22) 38%, #1b1510) 0%, #120e0a 72%); padding: 0; overflow: hidden; }
    .eqcell img { width: 52px; height: 52px; object-fit: contain; margin-top: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
    .eqcell .nm { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.75)); padding-top: 6px; }
    .eqcell .en { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 800; color: #9be36b; }
    .eqcell .sr { position: absolute; top: 2px; right: 4px; font-size: 10px; font-weight: 800; color: #ffd54a; }
    .eqcell.sel { box-shadow: 0 0 0 2px var(--gold), 0 0 12px #e8c26a88; }
    .eqmid { text-align: center; } .eqmid canvas { width: 100%; max-width: 200px; max-height: 230px; height: auto; object-fit: contain; }
    .eqpw { font-weight: 800; font-size: 18px; color: var(--gold); } .eqpw small { display: block; font-size: 11px; color: var(--mute); font-weight: 400; }
    .eqinfo { background: #0004; border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 6px 0; }
    .eqh { display: flex; gap: 8px; align-items: center; } .eqh img { width: 64px; height: 64px; object-fit: contain; border-radius: 12px; background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--gc, #3a2e22) 38%, #1b1510) 0%, #120e0a 72%); }
    .eqst { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } .eqst span { background: #ffffff10; border-radius: 6px; padding: 2px 6px; font-size: 12px; }
    #battle canvas#cv { width: 100%; height: 100%; display: block; touch-action: none; }
    /* ── v510 들판 HUD — 옆보기 방치 RPG 배치: 위 왼쪽 나 · 위 가운데 사냥터 · 위 오른쪽 작은 아이콘 · 아래 가운데 메뉴 다섯 · 왼쪽 아래 Lv/HP · 오른쪽 아래 무공 · 맨 아래 EXP ── */
    body { --sl: max(10px, env(safe-area-inset-left)); --sr: max(10px, env(safe-area-inset-right)); --st: max(8px, env(safe-area-inset-top)); --sb: max(8px, env(safe-area-inset-bottom)); }
    #app { max-width: none; position: relative; display: block; padding-top: 0; height: 100%; }
    #battle { position: absolute; inset: 0; }
    .ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    #battle .sh { text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,.6); }
    /* 위 왼쪽: 얼굴 · 전투력 · 이름 · 재화 */
    #tl { position: absolute; z-index: 20; left: var(--sl); top: var(--st); display: flex; gap: 8px; align-items: flex-start; pointer-events: none; }
    #face { width: 52px; height: 52px; border-radius: 12px; border: 2px solid rgba(232,200,122,.8); background: #120f0b; box-shadow: 0 2px 6px rgba(0,0,0,.5); }
    .tl-txt { display: flex; flex-direction: column; gap: 2px; color: #fff; text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,.7); }
    #pw { font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
    #pw::before { content: '⚔ '; color: var(--gold); }
    #nm { font-size: 11px; display: flex; gap: 6px; } #nm b { font-weight: 700; } #nm span { color: var(--gold); }
    .cur-row { display: flex; gap: 6px; margin-top: 2px; }
    .cur-pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px 1px 2px; border-radius: 999px; background: rgba(0,0,0,.45); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .coin { width: 15px; height: 15px; border-radius: 50%; display: inline-block; } .coin.s { background: radial-gradient(circle at 35% 35%, #fff7d6, #e8c26a 55%, #9a6b1f); } .coin.t { background: radial-gradient(circle at 35% 35%, #ffd2c8, #e06a5a 55%, #7c1d14); border-radius: 4px; }
    /* 위 가운데: 장 이름 · Stage 진행 */
    #tc { position: absolute; z-index: 20; left: 50%; transform: translateX(-50%); top: var(--st); width: min(300px, 34vw); text-align: center; pointer-events: none; }
    #chap-row { display: inline-flex; align-items: center; gap: 3px; color: #fff; font-size: 13px; font-weight: 700; text-shadow: 0 1px 2px #000, 0 0 4px rgba(0,0,0,.7); }
    #chap-row .ic { width: 15px; height: 15px; color: var(--gold); }
    #sp { position: relative; margin-top: 3px; height: 16px; border-radius: 999px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.35); overflow: hidden; }
    #sp-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #d49a2a, #ffd56a); transition: width .25s; }
    #sp.boss #sp-fill { background: linear-gradient(90deg, #7f1d1d, #ef4444); transition: none; }
    #sp-txt { position: absolute; inset: 0; font-size: 11px; font-weight: 800; line-height: 15px; color: #fff; text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
    #btn-boss { position: absolute; z-index: 21; left: 50%; transform: translateX(-50%); top: calc(var(--st) + 46px); bottom: auto; font-family: inherit; padding: 6px 16px; border-radius: 999px; font-weight: 800; font-size: 13px; color: #fff; background: linear-gradient(180deg, #c0392b, #7c1a1f); border: 1px solid #ffb4a8; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
    #btn-boss.ready { animation: pts-glow 1.4s ease-in-out infinite; }
    /* v519 두목전 — 위 가운데에 큰 두목 막대(이름 · 체력 % · 남은 초) */
    #contest-hud { top: calc(var(--st) + 46px); z-index: 20; width: min(440px, 52vw); padding: 5px 12px 6px; border-radius: 12px; background: rgba(30,6,6,.82); border: 1px solid rgba(248,113,113,.55); text-align: left; font-size: 11.5px; line-height: 1.35; min-width: 0; white-space: normal; }
    #contest-hud .ch-h { display: flex; align-items: center; gap: 6px; }
    .rt .coin.x { background: linear-gradient(180deg, #d9f99d, #84cc16); border-radius: 6px; } .rt .coin.st { background: radial-gradient(circle at 35% 30%, #e0f2fe, #60a5fa 55%, #1e3a8a); border-radius: 30% 60% 40% 55%; transform: rotate(-12deg); }
    #dg-leave { margin-left: auto; pointer-events: auto; font: inherit; font-size: 11px; padding: 3px 9px; min-height: 26px; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.35); color: #fff; } #contest-hud #contest-pct { margin-left: 4px; } #contest-hud.dg { background: rgba(8,22,40,.85); border-color: rgba(125,190,255,.55); } #contest-hud.dg .ic { color: #93c5fd; } #contest-hud.dg #contest-fill { background: linear-gradient(90deg, #3b82f6, #93c5fd); } #contest-hud .ch-h .ic { width: 16px; height: 16px; color: #fca5a5; }
    #contest-title { flex: 1; font-size: 13px; font-weight: 800; color: #fff; } #contest-pct { font-weight: 800; color: #fecaca; font-variant-numeric: tabular-nums; }
    #contest-bar { position: relative; height: 10px; margin: 4px 0 3px; border-radius: 999px; background: rgba(0,0,0,.6); overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
    #contest-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: linear-gradient(180deg, #ff6b6b, #b91c1c); transition: width .2s; }
    #contest-trail { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #fff; transition: background-color .18s; }
    #contest-bar.go #contest-trail { background: #ffd56a; }
    #contest-bar.bf #contest-fill { transition: none; }
    #contest-bar.hitf { border-color: #fff; box-shadow: 0 0 0 1px #fff, 0 0 10px 2px rgba(255,236,170,.85); }
    #contest-bar .ntk { display: none; position: absolute; top: 0; bottom: 0; width: 1px; margin-left: -.5px; background: rgba(0,0,0,.55); box-shadow: 1px 0 0 rgba(255,255,255,.22); }
    #contest-bar.nt .ntk { display: block; }
    #contest-pop { display: none; position: absolute; top: -1px; bottom: -1px; width: 4px; margin-left: -2px; border-radius: 2px; background: #fff; box-shadow: 0 0 8px 3px #ffe9a8; }
    #contest-pop.on { display: block; animation: cb-pop .42s ease-out both; }
    @keyframes cb-pop { 0% { transform: scale(7, 1.6); opacity: 1; } 35% { transform: scale(1.6, 1.3); opacity: 1; } 100% { transform: scale(1, 1); opacity: 0; } }
    #contest-sub { color: rgba(255,255,255,.7); font-size: 11px; }
    body.bossing #qc { display: none; }
    .pj-g { color: var(--gold); font-weight: 800; text-decoration: underline; }
    /* v523 무인 고르기 · 방치 보상 */
    #modal .sheet.wide { width: min(760px, 94vw); max-width: none; } html.rot #modal .sheet.wide { width: min(760px, 94vh); }
    .jobgrid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
    .jobcard { display: flex !important; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px 8px !important; min-height: 0; border-radius: 12px !important; background: radial-gradient(circle at 50% 40%, rgba(232,194,106,.18), rgba(0,0,0,.3) 70%) !important; border: 1px solid rgba(232,194,106,.35) !important; color: #fff !important; text-align: center; }
    .jobcard:hover, .jobcard:active { border-color: var(--gold) !important; transform: translateY(-2px); }
    .jobcard canvas { width: 100%; max-width: 120px; height: auto; aspect-ratio: 4 / 5; }
    .jobcard b { font-size: 16px; } .jobcard small { font-size: 11px; color: rgba(255,255,255,.75); line-height: 1.3; } .jobcard em { font-style: normal; font-size: 10.5px; color: var(--gold); line-height: 1.3; }
    html.h500 .jobcard canvas { max-width: 70px; } html.h500 .jobgrid { gap: 6px; margin-top: 4px; } html.h500 .jobcard small { display: none; } html.h500 .jobcard b { font-size: 14px; } html.h500 .jobcard em { font-size: 10px; }
    html.h500 #modal .sheet.wide > div > .note { margin: 0; font-size: 11px; }

        <button class="ib nb" data-tab="social"><svg class="ic" viewBox="0 0 24 24"><path d="M5 21V3"/><path d="M5 4h12l-2.5 4L17 12H5"/></svg><span>무림</span></button>
        <button class="ib" id="b-saver" aria-label="절전"><svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><span>절전</span></button>
        <button class="ib" id="b-opt" aria-label="설정"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>설정</span></button>

      <button id="qc" class="hidden"></button>
      <button id="fc" class="fate-chip hidden" aria-label="기연"><i>緣</i><span>기연</span><b id="fc-n"></b><em class="fate-fill" id="fc-fill"></em></button>
      <button id="nx" class="hidden"></button>
      <div class="dpsm" id="dpsm"></div>
      <div id="loglines"></div>
      <button id="btn-boss" class="hidden">두목 도전</button>
      <div id="lootbox"></div>
      <div id="contest-hud" class="hidden"><div class="ch-h"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8l4 3 4-6 4 6 4-3-2 11H6z"/></svg><b id="contest-title"></b><span id="contest-pct"></span><button id="dg-leave" class="hidden">나가기</button></div><div id="contest-bar"><i id="contest-trail"></i><i id="contest-fill"></i><i class="ntk" style="left:25%"></i><i class="ntk" style="left:50%"></i><i class="ntk" style="left:75%"></i><i id="contest-pop"></i></div><div id="cb-row"><span id="cb-ph"></span><div id="cb-ggb"><i id="cb-gg"></i></div></div><div id="contest-sub"></div></div>

        <div class="me-h"><b id="me-lv">Lv.1</b><span id="me-nm">무명</span></div>
        <div class="bar hp"><i id="hp-trail"></i><i id="hp-fill"></i><span id="hp-txt">HP 0 / 0</span></div>
      </div>

        <button class="nb" data-tab="char"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span>캐릭터</span></button>
        <button class="nb" data-tab="bag"><svg class="ic" viewBox="0 0 24 24"><path d="M8 3L3 6l2 5 3-1v11h8V10l3 1 2-5-5-3c-.6 1.8-2.1 3-4 3S8.6 4.8 8 3z"/></svg><span>장비</span></button>
        <button class="nb" data-key="hero:1"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3c.5 3.5 6 5.5 6 10.5a6 6 0 0 1-12 0c0-2.8 1.6-4.3 2.3-6 .9 1.2 1.6 2.5 1.7 4 1.4-2.2 2.2-5.3 2-8.5z"/></svg><span>무공</span></button>
        <button class="nb" data-tab="comp"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.6 14.2c3 .2 5.4 2.3 5.4 5.8"/></svg><span>동료</span></button>
        <button class="nb" data-tab="dgn"><svg class="ic" viewBox="0 0 24 24"><path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6a3 3 0 0 1 6 0v6"/></svg><span>던전</span></button>
      </nav>
      <div id="pad" class="hidden"><button id="pl" aria-label="왼쪽">◀</button><button id="pd" aria-label="내려가기">▼</button><button id="pr" aria-label="오른쪽">▶</button></div>
      <div id="sk"><button id="au" class="on">자동</button><div id="slots" style="display:contents"></div><div id="pbuf" class="hidden"></div><button id="ds" class="hidden" aria-label="회피"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12h11M11 6l6 6-6 6M19 5v14"/></svg><i></i></button><button id="jp" aria-label="점프"><svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div>
      <div id="xpl"><span id="xp-txt">EXP 0.00%</span><div id="xp-bar"><i id="xp-fill"></i></div></div>
      <div id="combo"></div><div id="res"></div>

    <div id="panel-dim"></div>
    <main id="panel">
      <div id="panel-head">
        <button id="panel-grip" aria-label="창 펼치기"></button>
        <b id="panel-title"></b>
        <div class="res-row"></div>
        <button id="panel-close" aria-label="닫기">✕</button>
      </div>
      <nav id="ptabs"></nav>
      <div id="panel-body"></div>
    </main>
  </div>

  <div id="modal" class="hidden"><div class="sheet"></div></div>
  <div id="toast"></div>
  <script type="module" src="js/s2/ui/app.js"></script>
