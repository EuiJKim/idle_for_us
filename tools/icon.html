<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>아이콘 생성</title>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
// 앱 아이콘: 한지 + 먹 원상 + 붓글씨 회 + 붉은 낙관. ?pad=0.2 이면 maskable 여백
const pad = Number(new URLSearchParams(location.search).get('pad') || 0.06);
document.fonts.load('400px "Yuji Syuku"', '회무').then(() => {
  const c = document.getElementById('c').getContext('2d');
  const S = 1024;
  const g = c.createRadialGradient(S * 0.4, S * 0.35, 50, S / 2, S / 2, S * 0.75);
  g.addColorStop(0, '#f4ead3'); g.addColorStop(1, '#d6c39b');
  c.fillStyle = g; c.fillRect(0, 0, S, S);
  for (let i = 0; i < 1400; i++) { c.fillStyle = `rgba(120,90,50,${Math.random() * 0.05})`; c.fillRect(Math.random() * S, Math.random() * S, 2, 2); }
  const k = 1 - pad * 2;
  c.save(); c.translate(S / 2, S / 2); c.scale(k, k); c.translate(-S / 2, -S / 2);
  // 원상: 붓으로 한 번에 그린 원
  c.lineCap = 'round';
  for (let i = 0; i < 26; i++) {
    c.strokeStyle = `rgba(15,12,10,${0.05 + i * 0.012})`;
    c.lineWidth = 60 - i * 1.8;
    c.beginPath(); c.arc(S / 2, S / 2 + 10, 380 + i * 1.2, -1.2 + i * 0.01, 4.7 - i * 0.02); c.stroke();
  }
  c.fillStyle = '#100c09';
  c.font = '620px "Yuji Syuku"';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('회', S / 2 - 10, S / 2 + 40);
  // 붉은 낙관
  c.save(); c.translate(S * 0.76, S * 0.78); c.rotate(-0.08);
  c.fillStyle = '#b3261e'; c.fillRect(-90, -90, 180, 180);
  c.fillStyle = '#f8ecd8'; c.font = '150px "Yuji Syuku"'; c.fillText('무', 0, 12);
  c.restore();
  c.restore();
  window.__done = true;
});
</script></body></html>
