<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>방치형키우기 — 새 시즌 미리보기</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #14110e; --panel: #221c16; --line: #3a3027; --ink: #f1e6d4; --mute: #a8977f; --gold: #e8c26a; --red: #e06a5a; --blue: #6aa8e0; --green: #7cc47a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow: hidden; }
    #app { position: relative; max-width: 520px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
    #stage { position: relative; flex: 1; min-height: 0; }
    canvas { width: 100%; height: 100%; display: block; background: #2a2a20; }
    .corner { position: absolute; padding: 8px; pointer-events: none; }
    .corner > * { pointer-events: auto; }
    #tl { top: 0; left: 0; right: 40%; }
    #tr { top: 0; right: 0; text-align: right; }
    #bl { bottom: 0; left: 0; right: 30%; }
    #br { bottom: 0; right: 0; }
    .lv { font-weight: 700; font-size: 16px; text-shadow: 0 1px 2px #000; }
    .bar { height: 6px; background: #0008; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .bar > i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .2s; }
    .bar.hp > i { background: var(--red); }
    .pw { color: var(--gold); font-size: 12px; text-shadow: 0 1px 2px #000; }
    .cur { display: inline-block; background: #000a; border-radius: 10px; padding: 2px 8px; margin: 0 0 4px 4px; font-size: 12px; }
    .guide { background: #000b; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; cursor: pointer; }
    .guide.done { border-color: var(--gold); box-shadow: 0 0 10px #e8c26a66; }
    .guide b { color: var(--gold); }
    .round { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--gold); background: #000b; color: var(--ink); font-weight: 700; font-size: 13px; }
    .round small { display: block; font-weight: 400; color: var(--mute); font-size: 10px; }
    nav { display: flex; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    nav button { flex: 1; min-height: 52px; background: none; border: 0; color: var(--ink); font-size: 13px; }
    nav button.on { color: var(--gold); }
    button { font: inherit; cursor: pointer; }
    #win { position: absolute; inset: 0 0 52px 0; background: var(--panel); display: none; flex-direction: column; z-index: 5; }
    #win.open { display: flex; }
    #win header { display: flex; align-items: center; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
    #win header h2 { margin: 0; flex: 1; font-size: 17px; }
    #win .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    #win .tabs button { background: #0004; border: 1px solid var(--line); color: var(--ink); border-radius: 14px; padding: 4px 12px; white-space: nowrap; min-height: 32px; }
    #win .tabs button.on { border-color: var(--gold); color: var(--gold); }
    #win .body { flex: 1; overflow-y: auto; padding: 10px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #ffffff10; }
    .row .k { flex: 1; }
    .row .v { color: var(--mute); font-size: 12px; }
    .btn { background: #3b2f22; border: 1px solid var(--gold); color: var(--ink); border-radius: 8px; padding: 6px 12px; min-height: 36px; min-width: 44px; }
    .btn:disabled { opacity: .4; border-color: var(--line); }
    .x { background: none; border: 0; color: var(--ink); font-size: 22px; min-width: 44px; min-height: 44px; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .cell { background: #0005; border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 11px; min-height: 58px; }
    .cell b { display: block; font-size: 15px; }
    .g0 { border-color: #777 } .g1 { border-color: #7cc47a } .g2 { border-color: #6aa8e0 } .g3 { border-color: #b27ae0 } .g4 { border-color: #e8c26a } .g5 { border-color: #e06a5a } .g6 { border-color: #fff }
    #toast { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); z-index: 9; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
    #toast div { background: #000c; border: 1px solid var(--gold); padding: 4px 12px; border-radius: 12px; animation: fade 2.6s forwards; }
    @keyframes fade { 0%, 80% { opacity: 1 } 100% { opacity: 0 } }
    #pop { position: absolute; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; }
    #pop.open { display: flex; }
    #pop .card { background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; padding: 16px; width: min(90%, 360px); }
    #pop h3 { margin: 0 0 8px; }
    #pop .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .note { color: var(--mute); font-size: 12px; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="corner" id="tl"></div>
      <div class="corner" id="tr"></div>
      <div class="corner" id="bl"></div>
      <div class="corner" id="br"></div>
      <div id="toast"></div>
      <section id="win" aria-modal="true" role="dialog"><header><h2 id="wt"></h2><button class="x" id="wx" aria-label="닫기">×</button></header><div class="tabs" id="wtabs"></div><div class="body" id="wb"></div></section>
      <div id="pop"><div class="card" id="pc"></div></div>
    </div>
    <nav id="nav"></nav>
  </div>
  <script type="module" src="js/s2/ui/app.js"></script>
</body>
</html>
