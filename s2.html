<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>방치형키우기 — 새 시즌 미리보기</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#120f0b">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Nanum+Brush+Script&family=Gowun+Batang:wght@400;700&display=swap">
  <!-- v505 지금 게임(무림방치)과 같은 화면 틀 · 같은 CSS — 위 상태 줄 · 사냥터 줄 · 들판(양옆 창 단추 · 무공 줄) · 아래에서 올라오는 창 -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --mute: var(--muted); --ink: var(--text); --red: #e06a5a; --blue: #6aa8e0; --green: #7cc47a; }
    /* 새 시즌만의 것 — 옆보기 조작(◀▼▶ · 점프) · 두목 도전 · 길잡이 자리 · 피해 측정기 · 결과 · 장비 창 · 뽑기 연출 */
    #battle canvas#cv { width: 100%; height: 100%; display: block; touch-action: none; }
    #hud { z-index: 10; }
    #quest { top: 10px; }
    #btn-boss { position: absolute; left: 50%; transform: translateX(-50%); top: 44px; z-index: 11; }
    #btn-boss.ready { animation: pts-glow 1.4s ease-in-out infinite; }
    #side-btns { position: absolute; right: 8px; top: 44px; z-index: 11; display: flex; flex-direction: column; gap: 6px; }
    #side-btns .icon-btn { width: 38px; height: 38px; }
    .dpsm { position: absolute; left: 8px; top: 40px; z-index: 10; display: none; background: rgba(10,8,6,.65); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 11px; line-height: 1.45; }
    .dpsm b { color: var(--accent-2); font-weight: 700; margin-right: 4px; }
    #loglines { position: absolute; left: 8px; bottom: calc(132px + var(--safe-bottom, 0px)); z-index: 9; font-size: 11px; color: #f5e9cf; text-shadow: 0 1px 2px #000; pointer-events: none; max-width: 50%; }
    #loglines div { opacity: .9; }
    #skillbar .auto-btn { flex: none; }
    #skillbar .skill-btn { font-family: var(--serif); font-size: 13px; font-weight: 800; line-height: 1.1; padding: 0 2px; }
    #skillbar .skill-btn .t { position: absolute; left: 4px; top: 2px; font-size: 9px; color: var(--muted); font-family: inherit; }
    #skillbar .skill-btn .ad { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: #86efac; box-shadow: 0 0 4px #86efac; }
    #skillbar .skill-btn.empty { border-style: dashed; color: var(--muted); font-size: 18px; font-weight: 400; }
    #skillbar .skill-btn .cdw { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end; padding: 0 4px 2px 0; font-size: 11px; color: #fff; background: conic-gradient(rgba(0,0,0,.7) var(--p, 0%), transparent 0); }
    #skillbar .skill-btn.fire { animation: sf .32s ease-out; } @keyframes sf { 0% { box-shadow: inset 0 0 18px #ffe9a8; transform: scale(1.06) } 100% { box-shadow: none; transform: none } }
    #skillbar .jump-btn { flex: none; width: 54px; font-family: var(--brush); font-size: 22px; }
    #pad { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(74px + var(--safe-bottom, 0px)); z-index: 13; display: flex; gap: 8px; }
    #pad button { width: 56px; height: 44px; border-radius: 11px; background: rgba(18,15,11,.78); border: 1px solid rgba(212,166,74,.35); color: #f5e9cf; font-size: 18px; }
    #pad button.on, #pad button:active { background: rgba(212,166,74,.3); }
    #tabs button.dot-on::after { content: ''; position: absolute; top: -3px; right: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
    #ptabs button.dot-on::after { content: ''; position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
    #progress.boss #progress-fill { background: linear-gradient(90deg, #7c1a1f, #c0392b); }
    #panel-body .card .row:last-child { margin-bottom: 0; }
    #panel-body .row .btn { flex: none; padding: 8px 12px; min-width: 56px; }
    #panel-body .row .btn + .btn { margin-left: -4px; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 4px 2px 10px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; margin-bottom: 10px; }
    .cell { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; text-align: center; font-size: 11px; min-height: 58px; }
    .cell b { display: block; font-size: 15px; font-family: var(--serif); }
    .g0 { border-color: #777 } .g1 { border-color: #7cc47a } .g2 { border-color: #6aa8e0 } .g3 { border-color: #b27ae0 } .g4 { border-color: #e8c26a } .g5 { border-color: #e06a5a } .g6 { border-color: #fff }
    .g0t { color: #ccc } .g1t { color: #7cc47a } .g2t { color: #6aa8e0 } .g3t { color: #b27ae0 } .g4t { color: #e8c26a } .g5t { color: #e06a5a } .g6t { color: #fff }
    /* 칸 두목 결과 */
    #res { position: absolute; inset: 0; background: rgba(0,0,0,.72); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 30; gap: 10px; }
    #res.open { display: flex; }
    #res .st { font-family: var(--serif); font-weight: 700; letter-spacing: 1px; color: #f5e9cf; } #res .st em { font-style: normal; color: var(--accent-2); }
    #res .big { font-family: var(--brush); font-size: 64px; line-height: 1; color: #d6d3d1; }
    #res .big.win { color: var(--gold); text-shadow: 0 0 18px rgba(232,200,122,.5); }
    #res .acts { display: flex; gap: 12px; margin-top: 12px; }
    #res .acts .btn { min-width: 130px; }
    /* 장비 뽑기 연출(v497) */
    .gx { position: fixed; inset: 0; z-index: 60; background: radial-gradient(#1a1410ee, #050302f5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
    .gx.flash::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, var(--gc, #fff) 0%, transparent 70%); animation: gxf .7s ease-out forwards; }
    @keyframes gxf { from { opacity: .85 } to { opacity: 0 } }
    .gxt { font-weight: 800; color: var(--gold); font-size: 16px; text-align: center; }
    .gxg { display: grid; grid-template-columns: repeat(5, 64px); gap: 8px; max-height: 70vh; overflow: auto; }
    .gxg.many { grid-template-columns: repeat(10, 52px); gap: 5px; }
    .gc { position: relative; width: 64px; height: 84px; perspective: 400px; }
    .gxg.many .gc { width: 52px; height: 70px; }
    .gc > div { position: absolute; inset: 0; border-radius: 9px; backface-visibility: hidden; transition: transform .32s ease; }
    .gc .back { background: repeating-linear-gradient(45deg, #3a2a18, #3a2a18 6px, #2a1e10 6px, #2a1e10 12px); border: 2px solid #6b5230; }
    .gc .face { transform: rotateY(180deg); background: radial-gradient(#3a2e22, #17120d); border: 2px solid var(--gc); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; }
    .gc .face img { width: 60%; } .gc .face small { color: var(--mute); font-size: 10px; }
    .gc .face i { position: absolute; top: 2px; right: 3px; font-style: normal; font-size: 9px; background: var(--gold); color: #000; border-radius: 4px; padding: 0 3px; }
    .gc.open .back { transform: rotateY(180deg); } .gc.open .face { transform: rotateY(360deg); }
    .gc.open.g4 .face, .gc.open.g5 .face, .gc.open.g6 .face { animation: gcp 1.2s ease-in-out infinite alternate; }
    @keyframes gcp { from { box-shadow: 0 0 8px 1px var(--gc) } to { box-shadow: 0 0 20px 6px var(--gc) } }
    .gc.tense .back { animation: gct .12s linear infinite; box-shadow: 0 0 18px 6px var(--gc); border-color: var(--gc); }
    @keyframes gct { 0% { transform: translate(0, 0) } 25% { transform: translate(-2px, 1px) } 50% { transform: translate(2px, -1px) } 75% { transform: translate(-1px, -1px) } 100% { transform: translate(1px, 1px) } }
    .gxb .btn { min-width: 120px; min-height: 44px; }
    .eqpage { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    @media (min-width: 640px) { .eqpage { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; } }
    .eqwrap { display: grid; grid-template-columns: 64px 1fr 64px; gap: 6px; align-items: center; max-width: 460px; margin: 0 auto; }
    .eqcol { display: flex; flex-direction: column; gap: 6px; }
    .eqcell { position: relative; width: 64px; height: 50px; border-radius: 10px; border: 2px solid var(--line); background: radial-gradient(#3a2e22, #17120d); padding: 0; }
    .eqcell img { width: 34px; height: 34px; object-fit: contain; margin-top: 2px; }
    .eqcell .nm { position: absolute; left: 0; right: 0; bottom: 1px; font-size: 10px; color: var(--mute); }
    .eqcell .en { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 800; color: #9be36b; }
    .eqcell .sr { position: absolute; top: 2px; right: 4px; font-size: 10px; font-weight: 800; color: #ffd54a; }
    .eqcell.sel { box-shadow: 0 0 0 2px var(--gold), 0 0 12px #e8c26a88; }
    .eqmid { text-align: center; } .eqmid canvas { width: 100%; max-width: 200px; max-height: 230px; height: auto; object-fit: contain; }
    .eqpw { font-weight: 800; font-size: 18px; color: var(--gold); } .eqpw small { display: block; font-size: 11px; color: var(--mute); font-weight: 400; }
    .eqinfo { background: #0004; border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin: 6px 0; }
    .eqh { display: flex; gap: 8px; align-items: center; } .eqh img { width: 48px; height: 48px; }
    .eqst { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; } .eqst span { background: #ffffff10; border-radius: 6px; padding: 2px 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="hero-box">
        <canvas id="portrait" width="104" height="104" aria-hidden="true"></canvas>
        <div class="hero-txt">
          <div class="hero-line"><b id="hero-name">무명</b></div>
          <div class="hero-sub"><span id="hero-rank">-</span><span id="hero-lv">Lv.1</span><span id="exp-pct"></span></div>
          <div id="exp-bar"><div></div></div>
        </div>
      </div>
      <div class="res-col">
        <div class="res res-silver"><span class="cur silver" aria-label="은자">은</span><b id="gold">0</b></div>
        <div class="res res-potion"><span class="cur potion" aria-label="뽑기권">권</span><b id="tickets">0</b></div>
      </div>
      <button id="btn-settings" class="icon-btn" aria-label="설정">⚙</button>
    </header>

    <div id="stagebar">
      <div class="stage-box">
        <div id="stage-label">죽림</div>
        <div id="zone-label">Stage 1/10</div>
      </div>
      <div id="progress" class="hp">
        <div id="progress-trail"></div>
        <div id="progress-fill"></div>
        <span id="progress-text">0 / 20</span>
      </div>
    </div>

    <section id="battle">
      <canvas id="cv"></canvas>
      <div id="hud"><div id="power-label">전투력 0</div></div>
      <button id="quest" class="hidden"></button>
      <button id="btn-boss" class="hidden">두목 도전</button>
      <div id="contest-hud"><div id="contest-title"></div><div id="contest-sub"></div></div>
      <div class="dpsm" id="dpsm"></div>
      <div id="side-btns"><button id="btn-sound" class="icon-btn" aria-label="소리">🔊</button></div>
      <div id="loglines"></div>
      <nav id="tabs">
        <div class="tabcol left">
          <button data-tab="map"><i>지</i><span>지도</span></button>
          <button data-tab="dgn"><i>전</i><span>던전</span></button>
          <button data-tab="town"><i>촌</i><span>마을</span></button>
          <button data-tab="social"><i>무</i><span>무림<em class="tab-sub">문파</em></span></button>
        </div>
        <div class="tabcol right">
          <button data-tab="char"><i>인</i><span>캐릭터</span></button>
          <button data-tab="bag"><i>낭</i><span>가방</span></button>
          <button data-tab="comp"><i>수</i><span>동료</span></button>
        </div>
      </nav>
      <div id="pad" class="hidden"><button id="pl" aria-label="왼쪽">◀</button><button id="pd" aria-label="내려가기">▼</button><button id="pr" aria-label="오른쪽">▶</button></div>
      <div id="skillbar"><button class="auto-btn on" id="au">자동</button><div id="slots" style="display:contents"></div><button class="skill-btn jump-btn" id="jp" aria-label="점프">⤒</button></div>
      <div id="res"></div>
    </section>

    <div id="panel-dim"></div>
    <main id="panel">
      <div id="panel-head">
        <button id="panel-grip" aria-label="창 펼치기"></button>
        <b id="panel-title"></b>
        <div class="res-row"></div>
        <button id="panel-close" aria-label="닫기">✕</button>
      </div>
      <nav id="ptabs"></nav>
      <div id="panel-body"></div>
    </main>
  </div>

  <div id="modal" class="hidden"><div class="sheet"></div></div>
  <div id="toast"></div>
  <script type="module" src="js/s2/ui/app.js"></script>
</body>
</html>
