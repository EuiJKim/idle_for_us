<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>방치형키우기 — 새 시즌 미리보기</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --bg: #14110e; --panel: #221c16; --line: #3a3027; --ink: #f1e6d4; --mute: #a8977f; --gold: #e8c26a; --red: #e06a5a; --blue: #6aa8e0; --green: #7cc47a; --glass: rgba(18, 14, 10, .62); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 13px/1.35 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
    #app { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; }
    #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .hud { position: absolute; pointer-events: none; }
    .hud > * { pointer-events: auto; }
    button { font: inherit; cursor: pointer; color: var(--ink); }
    /* 왼쪽 위: 얼굴 · 전투력 · 재화 · 길잡이 */
    #tl { top: 6px; left: max(8px, env(safe-area-inset-left)); width: min(44%, 300px); }
    .prof { display: flex; gap: 8px; align-items: center; }
    .face { width: 46px; height: 46px; border-radius: 8px; border: 2px solid var(--gold); background: var(--glass); display: grid; place-items: center; font-weight: 800; font-size: 18px; color: var(--gold); }
    .pw { font-weight: 800; font-size: 15px; text-shadow: 0 1px 2px #000; }
    .pw small { display: block; font-weight: 400; font-size: 11px; color: #fde68a; }
    .curs { margin-top: 4px; display: flex; gap: 10px; text-shadow: 0 1px 2px #000; font-weight: 700; }
    .curs i { font-style: normal; color: var(--gold); }
    .guide { margin-top: 6px; background: var(--glass); border-left: 3px solid var(--gold); border-radius: 4px; padding: 5px 8px; cursor: pointer; }
    .guide b { color: #fde68a; display: block; font-size: 12px; }
    .guide.done { box-shadow: 0 0 10px #e8c26a88; }
    /* 위 가운데: 지역 · 스테이지 막대 · 도전 / 두목 체력 */
    #tc { top: 6px; left: 50%; transform: translateX(-50%); width: min(38%, 340px); text-align: center; text-shadow: 0 1px 2px #000; }
    .zname { font-weight: 800; font-size: 14px; }
    .sbar { position: relative; height: 10px; background: #0009; border-radius: 6px; margin: 4px 0 2px; overflow: hidden; border: 1px solid #0006; }
    .sbar > i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#ffd27a, #e09a2c); }
    .sbar.boss > i { background: linear-gradient(#ff7a6a, #c0392b); }
    .sbar.time > i { background: linear-gradient(#fff07a, #e8c23a); }
    .srow { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12px; }
    #chal { background: linear-gradient(#ffb547, #e07b1c); border: 0; border-radius: 6px; padding: 4px 14px; font-weight: 800; color: #fff; min-height: 30px; box-shadow: 0 2px 0 #7a3a0a; }
    #chal:disabled { filter: grayscale(1) brightness(.7); box-shadow: none; }
    /* 오른쪽 위: 알림 줄 · 설정 */
    #tr { top: 6px; right: max(8px, env(safe-area-inset-right)); width: min(30%, 280px); text-align: right; }
    .chat { background: var(--glass); border-radius: 6px; padding: 4px 8px; font-size: 11px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rw { margin-top: 6px; text-align: left; background: var(--glass); border-left: 3px solid var(--red); border-radius: 4px; padding: 5px 8px; display: none; }
    /* 아래 가운데: Lv · 이름 · 체력 · 내공 */
    #bc { bottom: 4px; left: 50%; transform: translateX(-50%); width: min(34%, 290px); }
    .me { background: linear-gradient(#f5f1ea, #d9d2c6); color: #222; border-radius: 6px; padding: 4px 8px 6px; box-shadow: 0 2px 6px #0008; }
    .me .top { display: flex; justify-content: space-between; font-weight: 800; font-size: 13px; }
    .me .bar { position: relative; height: 13px; border-radius: 3px; background: #333; margin-top: 3px; overflow: hidden; }
    .me .bar > i { position: absolute; inset: 0 auto 0 0; }
    .me .bar.hp > i { background: linear-gradient(#ff8fa3, #e0436a); } .me .bar.mp > i { background: linear-gradient(#8fd3ff, #2f8fe0); }
    .me .bar span { position: relative; display: block; text-align: center; color: #fff; font-size: 10px; line-height: 13px; text-shadow: 0 1px 1px #000; }
    .me .bar b { position: absolute; left: 4px; top: 0; font-size: 9px; color: #fff; line-height: 13px; z-index: 1; }
    /* 오른쪽 아래: 무공 칸 · 점프 · 자동 */
    #br { bottom: 6px; right: max(8px, env(safe-area-inset-right)); display: flex; align-items: flex-end; gap: 8px; }
    .slots { display: grid; grid-template-columns: repeat(3, 44px); gap: 5px; }
    .slot { width: 44px; height: 44px; border-radius: 8px; border: 1px solid #ffffff44; background: var(--glass); position: relative; font-size: 11px; display: grid; place-items: center; }
    .slot.on { border-color: var(--gold); background: radial-gradient(#e8c26a55, #2a1d0f); }
    .slot .ad { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: #7cf06a; box-shadow: 0 0 4px #7cf06a; }
    .slot .cd { position: absolute; inset: 0; display: grid; place-items: center; background: #000a; border-radius: 8px; font-weight: 800; font-size: 14px; }
    .jump { width: 78px; height: 78px; border-radius: 50%; border: 3px solid #ffffffaa; background: radial-gradient(#ffffff22, #0007); font-size: 28px; font-weight: 800; }
    .auto { position: absolute; bottom: calc(100% + 6px); right: 10px; width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--green); background: var(--glass); font-size: 11px; font-weight: 800; color: #c8f7c5; }
    .auto.off { border-color: var(--mute); color: var(--mute); }
    /* 왼쪽 아래: 경험치 · 얻은 것 · 좌우 */
    #bl { bottom: 6px; left: max(8px, env(safe-area-inset-left)); width: min(28%, 260px); }
    .log { font-size: 11px; text-shadow: 0 1px 2px #000; max-height: 60px; overflow: hidden; }
    .log div { color: #fff3c4; }
    .pad { display: flex; gap: 8px; margin-top: 6px; }
    .pad button { width: 58px; height: 50px; border-radius: 12px; border: 1px solid #ffffff55; background: var(--glass); font-size: 20px; }
    .pad button:active, .pad button.on { background: #e8c26a55; }
    .exp { margin-top: 4px; font-size: 11px; font-weight: 800; color: #b9f5b5; text-shadow: 0 1px 2px #000; }
    #xpbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #0008; }
    #xpbar > i { display: block; height: 100%; background: #9be36b; width: 0; }
    nav { display: flex; background: linear-gradient(#2a2119, #1a140f); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    nav button { flex: 1; min-height: 44px; background: none; border: 0; font-size: 13px; }
    nav button.on { color: var(--gold); }
    /* 창 · 팝업 · 결과 */
    #win { position: absolute; inset: 0; background: var(--panel); display: none; flex-direction: column; z-index: 5; }
    #win.open { display: flex; }
    #win header { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    #win header h2 { margin: 0; flex: 1; font-size: 16px; }
    #win .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 6px 10px; border-bottom: 1px solid var(--line); }
    #win .tabs button { background: #0004; border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; white-space: nowrap; min-height: 32px; }
    #win .tabs button.on { border-color: var(--gold); color: var(--gold); }
    #win .body { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #ffffff10; }
    .row .k { flex: 1; } .row .v { color: var(--mute); font-size: 12px; }
    .btn { background: #3b2f22; border: 1px solid var(--gold); border-radius: 8px; padding: 6px 12px; min-height: 36px; min-width: 44px; }
    .btn:disabled { opacity: .4; border-color: var(--line); }
    .x { background: none; border: 0; font-size: 22px; min-width: 44px; min-height: 44px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
    .cell { background: #0005; border: 1px solid var(--line); border-radius: 8px; padding: 6px 2px; text-align: center; font-size: 11px; min-height: 58px; }
    .cell b { display: block; font-size: 15px; }
    .g0 { border-color: #777 } .g1 { border-color: #7cc47a } .g2 { border-color: #6aa8e0 } .g3 { border-color: #b27ae0 } .g4 { border-color: #e8c26a } .g5 { border-color: #e06a5a } .g6 { border-color: #fff }
    #toast { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); z-index: 9; display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
    #toast div { background: #000c; border: 1px solid var(--gold); padding: 4px 12px; border-radius: 12px; animation: fade 2.6s forwards; }
    @keyframes fade { 0%, 80% { opacity: 1 } 100% { opacity: 0 } }
    #pop { position: absolute; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 10; }
    #pop.open { display: flex; }
    #pop .card { background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; padding: 16px; width: min(90%, 380px); }
    #pop h3 { margin: 0 0 8px; }
    #pop .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
    #res { position: absolute; inset: 0; background: #000b; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 8; gap: 10px; }
    #res.open { display: flex; }
    #res .st { font-weight: 800; letter-spacing: 1px; } #res .st em { font-style: normal; color: #d4f04a; }
    #res .big { font-size: 56px; font-weight: 900; letter-spacing: 4px; background: linear-gradient(#fff, #9a9a9a); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #res .big.win { background: linear-gradient(#fff6c4, #e8a52a); -webkit-background-clip: text; background-clip: text; }
    #res .acts { display: flex; gap: 14px; margin-top: 14px; }
    #res .acts button { min-width: 140px; min-height: 46px; border-radius: 8px; border: 0; font-weight: 800; font-size: 15px; }
    #res .out { background: linear-gradient(#5ad0f0, #1e9fd0); } #res .again { background: linear-gradient(#d8f05a, #9cc81e); color: #223; }
    .note { color: var(--mute); font-size: 12px; }
    :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    @media (orientation: portrait) {
      #tl { width: 58%; } #tc { top: auto; bottom: 150px; width: 70%; } #tr { width: 38%; } #bc { width: 56%; bottom: 66px; } #bl { width: 40%; }
      .slots { grid-template-columns: repeat(2, 42px); } .jump { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="cv"></canvas>
      <div class="hud" id="tl"></div>
      <div class="hud" id="tc"></div>
      <div class="hud" id="tr"></div>
      <div class="hud" id="bc"></div>
      <div class="hud" id="bl"></div>
      <div class="hud" id="br"></div>
      <div id="xpbar"><i></i></div>
      <div id="toast"></div>
      <div id="res"></div>
      <section id="win" aria-modal="true" role="dialog"><header><h2 id="wt"></h2><button class="x" id="wx" aria-label="닫기">×</button></header><div class="tabs" id="wtabs"></div><div class="body" id="wb"></div></section>
      <div id="pop"><div class="card" id="pc"></div></div>
    </div>
    <nav id="nav"></nav>
  </div>
  <script type="module" src="js/s2/ui/app.js"></script>
</body>
</html>
