# v473 버그 신고 읽기 — 손으로만 돌린다(Actions → 버그 신고 읽기 → Run workflow).
# 저장소가 공개라 로그는 누구나 본다. 로그에는 건수만 평문으로 찍고(tools/readbugs.mjs 머리말),
# 신고 내용은 모두 pubkey(받는 쪽이 만든 RSA 공개 키, base64)로 암호화해서만 찍는다. pubkey가 없으면 아무것도 찍지 않는다.
name: 버그 신고 읽기

on:
  workflow_dispatch:
    inputs:
      n:
        description: '몇 건(최대 10)'
        default: '3'
      hours:
        description: '최근 몇 시간'
        default: '48'
      kind:
        description: 'user(사람이 누른 것) · auto(저절로) · 빈칸(둘 다)'
        default: 'user'
      pubkey:
        description: '받는 쪽 RSA 공개 키(PEM을 base64로) — 비우면 아무것도 안 찍는다'
        default: ''

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 서비스 계정으로 로그인
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: firebase-admin
        run: mkdir -p /tmp/rb && cd /tmp/rb && npm init -y >/dev/null && npm i firebase-admin@12 --no-audit --no-fund >/dev/null
      - name: 읽기
        env:
          N: ${{ inputs.n }}
          HOURS: ${{ inputs.hours }}
          KIND: ${{ inputs.kind }}
          PUBKEY: ${{ inputs.pubkey }}
        run: cp tools/readbugs.mjs /tmp/rb/readbugs.mjs && node /tmp/rb/readbugs.mjs
